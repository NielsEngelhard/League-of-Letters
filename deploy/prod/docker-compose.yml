services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      #- ./env/nginx-initial.conf:/etc/nginx/conf.d/default.conf  # Only for initial when certbot did not generate certificate yet
      - ./env/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - lol_core
      - lol_actions
    networks:
      - app-network
    restart: unless-stopped

  lol_core:
    image: nielsts/lol-core:1.0.17-beta
    hostname: league-of-letters.online
    env_file:
      - ./env/core.env
    expose:
      - "8080"
    networks:
      - app-network
    depends_on:
      - internal_dockerized_postgres
    environment:
      - NEXT_PUBLIC_ENVIRONMENT=Production
      - HOST=0.0.0.0
      - HOSTNAME=league-of-letters.online
      - NODE_ENV=Production
      - PORT=8080
    restart: unless-stopped

  lol_actions:
    image: nielsts/lol-actions:1.0.19-beta
    expose:
      - "8081"
    env_file:
      - ./env/actions.env
    environment:
      - NODE_ENV=Production
      - PORT=8081
    networks:
      - app-network
    restart: unless-stopped

  internal_dockerized_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: league_of_letters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "8082:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres-backup:/backup
    networks:
      - app-network
    restart: unless-stopped

  # Certbot service as a sleeping container that checks the certificates every x hours (and only renews if neccesarry)
  certbot:
      image: certbot/certbot
      volumes:
        - ./certbot/www:/var/www/certbot
        - ./certbot/conf:/etc/letsencrypt
      networks:
        - app-network
      profiles:
        - tools  # Added this line
      entrypoint: ""
      command: certbot certonly --webroot -w /var/www/certbot --email engelhardniels@gmail.com -d league-of-letters.online -d www.league-of-letters.online --non-interactive --agree-tos

volumes:
  postgres_dev_data:

networks:
  app-network:
    driver: bridge