map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream lol_core {
    server lol_core:8080;
}

upstream lol_actions {
    server lol_actions:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name league-of-letters.online www.league-of-letters.online;
    
    # Certbot verification location. This is crucial for obtaining and renewing your certificates.
    # It must be on the server listening to port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name league-of-letters.online www.league-of-letters.online;
    
    # Paths to the certificates issued by Certbot. The path is relative to the Certbot volume.
    ssl_certificate /etc/letsencrypt/live/league-of-letters.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/league-of-letters.online/privkey.pem;
    
    # Include recommended SSL security settings
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Route /actions to lol_actions (Express server)
    location /actions/ {
        proxy_pass http://lol_actions/;
        proxy_http_version 1.1;
        
        # Conditional WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket timeout settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # Route everything else to lol_core (Next.js server)
    location / {
        proxy_pass http://lol_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }
}